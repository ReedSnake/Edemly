<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Support Edemly</title>
  <meta name="description" content="Get support for Edemly and leave feedback.">
  <link rel="stylesheet" href="../assets/styles.css">
  <script src="../assets/app.js" defer></script>
</head>
<body data-page="support">
  <header class="site-header">
    <a class="brand" href="../">
      <span class="brand-mark" aria-hidden="true">E</span>
      <span>Edemly</span>
    </a>
    <nav class="site-nav" aria-label="Primary navigation">
      <a href="../">Home</a>
      <a href="../teams/">Teams</a>
      <a href="../download/">Download</a>
      <a href="../release/">Releases</a>
      <a href="../support/">Support</a>
    </nav>
  </header>

  <main>
    <section class="hero compact clean-download-hero support-hero">
      <div class="hero-copy">
        <p class="eyebrow">Support</p>
        <h1>Help shape Edemly.</h1>
        <p class="lead" data-support-summary>
          Send feedback, report a bug, or share an idea.
        </p>
        <div class="hero-actions">
          <a class="button primary" data-feedback-href href="https://docs.google.com/forms/d/e/1FAIpQLSdeL8Op6FNEp8r7vSrzEjooGSJfk8tPqKFfNoR8gPEHN9EOqA/viewform?usp=dialog" target="_blank" rel="noreferrer">
            Leave feedback
          </a>
        </div>
      </div>
    </section>

    <section class="support-grid" data-support-options>
      <p class="muted">Loading support options...</p>
    </section>
  </main>
</body>
</html>
