name: edemly-local

services:
  mysql:
    image: mysql:8.4
    container_name: edemly-local-mysql
    environment:
      MYSQL_ROOT_PASSWORD: securepass
      MYSQL_DATABASE: edemly
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  minio:
    image: minio/minio:latest
    container_name: edemly-local-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: edemly_admin
      MINIO_ROOT_PASSWORD: edemly_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    container_name: edemly-local-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 edemly_admin edemly_password; do
        echo 'Waiting for MinIO...';
        sleep 2;
      done;
      mc mb --ignore-existing local/edemly-uploads;
      "

  static:
    image: nginx:alpine
    container_name: edemly-local-static
    ports:
      - "8080:80"
    volumes:
      - ./static:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  server1:
    build:
      context: ../..
      dockerfile: Edemly.Server/Dockerfile
    container_name: edemly-local-server1
    environment:
      PORT: 8080
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Server=mysql;Port=3306;Database=edemly;User Id=root;Password=securepass;
      Brevo__ApiKey: MOCK_MODE
      PublicBaseUrl: http://localhost:3500
      WayForPay__TestMode: "true"
      WayForPay__DomainName: http://localhost:3500
      WayForPay__ReturnUrl: http://localhost:3500/api/payment/return
      FileStorage__Provider: Minio
      FileStorage__Minio__Endpoint: minio:9000
      FileStorage__Minio__AccessKey: edemly_admin
      FileStorage__Minio__SecretKey: edemly_password
      FileStorage__Minio__BucketName: edemly-uploads
      FileStorage__Minio__AutoCreateBucket: "true"
      MINIO_ROOT_USER: edemly_admin
      MINIO_ROOT_PASSWORD: edemly_password
    depends_on:
      mysql:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "3501:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  gateway:
    build:
      context: ../..
      dockerfile: Edemly.Gateway/Dockerfile
    container_name: edemly-local-gateway
    ports:
      - "3500:8080"
    volumes:
      - ./gateway/appsettings.json:/app/appsettings.json:ro
    depends_on:
      server1:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/gateway/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  gateway2:
    build:
      context: ../..
      dockerfile: Edemly.Gateway/Dockerfile
    container_name: edemly-local-gateway2
    ports:
      - "3600:8080"
    volumes:
      - ./gateway/appsettings.json:/app/appsettings.json:ro
    depends_on:
      server1:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/gateway/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  mysql_data:
  minio_data:
